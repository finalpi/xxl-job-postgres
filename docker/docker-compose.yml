services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xxl_job
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: xxl_job
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../doc/db/tables_xxl_job.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ../doc/db/log_partitions.sql:/docker-entrypoint-initdb.d/002-partitions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xxl_job -d xxl_job']
      interval: 5s
      timeout: 5s
      retries: 12

  xxl-job-admin:
    image: ghcr.io/finalpi/xxl-job-postgres:latest
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/xxl_job
      SPRING_DATASOURCE_USERNAME: xxl_job
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      XXL_JOB_LOGRETENTIONDAYS: ${XXL_JOB_LOGRETENTIONDAYS:-30}
      XXL_JOB_LEGACY_ACCESS_TOKEN: ${XXL_JOB_LEGACY_ACCESS_TOKEN:-}
      XXL_JOB_COMPATIBILITY_V340_ENABLED: ${XXL_JOB_COMPATIBILITY_V340_ENABLED:-true}
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m}
    ports:
      - '${XXL_JOB_ADMIN_PORT:-8080}:8080'
    volumes:
      - admin-logs:/data/applogs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  admin-logs:

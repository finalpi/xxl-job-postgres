spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:55438/xxl_job}
spring.datasource.username=${TEST_DATABASE_USER:xxltest}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=12
mybatis.mapper-locations=classpath:/mapper/**/*Mapper.xml
spring.freemarker.templateLoaderPath=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.settings.number_format=0.##########
spring.freemarker.settings.new_builtin_class_resolver=safer
spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.from=test@example.invalid
management.health.mail.enabled=false
xxl.job.timeout=1
xxl.job.i18n=zh_CN
xxl.job.triggerpool.fast.max=200
xxl.job.triggerpool.slow.max=100
xxl.job.schedule.batchsize=100
xxl.job.logretentiondays=30
xxl-sso.token.key=xxl_job_login_token
xxl-sso.token.timeout=604800000
xxl-sso.client.excluded.paths=/actuator/health
xxl-sso.client.login.path=/auth/login
